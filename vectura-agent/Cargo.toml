[package]
name = "vectura-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { version = "0.12", features = ["async_tokio"] }
bytes = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
vectura-common = { path = "../vectura-common" }
chrono = "0.4.45"
maxminddb = "0.30.0"

[profile.release]
opt-level = "z"       # Optimize for minimum binary size
lto = true            # Enable Link Time Optimization to remove dead code
codegen-units = 1     # Maximize optimization at the cost of compilation time
panic = "abort"       # Remove panic unwinding infrastructure overhead
strip = "symbols"     # Strip heavy debugging symbols from the binary
