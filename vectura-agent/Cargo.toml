[package]
name = "vectura-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { workspace = true }
aya-log = { workspace = true }

bytes = "1.5"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-native-tls"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
vectura-common = { path = "../vectura-common", features = ["user"] }

